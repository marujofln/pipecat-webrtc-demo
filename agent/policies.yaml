# Which tools each role may use. The caller's role comes from their number (E.164, no "+").
# Tools not listed under any role are always denied.
roles:
  guest:       # any unknown number (and the web test client, if not mapped)
    tools: [search_knowledge]
  patient:
    tools: [search_knowledge, list_available_slots, schedule_appointment]
  resident:
    tools: [search_knowledge, open_gate]
  staff:
    tools: [search_knowledge, list_available_slots, schedule_appointment, open_gate]

default_role: guest

# Caller "web-demo" is the local browser client.
callers:
  web-demo: staff
  "5511999990001": patient
  "5511999990002": resident
