[project]
name = "pipecat-webrtc-demo"
version = "0.1.0"
description = "Pipecat voice agent over WebRTC (WhatsApp) with RAG and authorized tools"
requires-python = ">=3.11"
dependencies = [
  "pipecat-ai[webrtc,silero,deepgram,cartesia,anthropic,openai,google,elevenlabs,groq]",
  "fastapi",
  "uvicorn[standard]",
  "httpx",
  "pyyaml",
  "pydantic-settings",
  "rank-bm25",
  "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, pyupgrade, bandit (security), simplify
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501"]  # assert is how pytest tests work; long fixture lines are fine
