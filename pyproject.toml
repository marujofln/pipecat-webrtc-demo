[project]
name = "pipecat-webrtc-demo"
version = "0.1.0"
description = "Pipecat voice agent over WebRTC (WhatsApp) with RAG and authorized tools"
requires-python = ">=3.11"
dependencies = [
  "pipecat-ai[webrtc,silero,deepgram,cartesia,anthropic,openai,google,elevenlabs,groq]",
  "fastapi",
  "uvicorn[standard]",
  "httpx",
  "pyyaml",
  "pydantic-settings",
  "rank-bm25",
  "python-dotenv",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
